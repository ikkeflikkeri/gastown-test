services:
  - type: web
    name: cardgrade-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_MODEL
        value: gpt-6.1-sol
      - key: OPENAI_API_KEY
        sync: false
